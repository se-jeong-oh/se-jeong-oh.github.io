<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동행 — 오세정</title>
<meta name="description" content="오세정이 함께 떠났던 사람들과, 그곳에 대한 기록.">
<meta property="og:title" content="동행 — 오세정">
<meta property="og:description" content="함께 떠났던 사람들과, 그곳에 대한 기록.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f2eee6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='4' width='18' height='24' rx='6' fill='%231d1b18'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>

  <header class="site-head">
    <div class="in">
      <a class="brand" href="#top" id="brand"></a>
      <span class="running" id="running" aria-live="polite"></span>
      <a class="to-index" href="#index">색인</a>
    </div>
  </header>

  <div class="layout" id="main">
    <!-- 창가 자리: 넓은 화면에서 왼쪽에 고정 -->
    <aside class="col-window" aria-label="창가 자리">
      <div class="win" id="win"></div>
      <div class="win-cap" id="win-cap"></div>
      <div class="seatbox">
        <div class="seats" id="seats" aria-hidden="true"></div>
        <p class="seat-lbl" id="seat-lbl"></p>
      </div>
      <p class="keys"><kbd>↓</kbd><kbd>↑</kbd> 다음 · 이전 여행<span class="keys-photo" id="keys-photo"><kbd>←</kbd><kbd>→</kbd> 사진 넘기기</span></p>
    </aside>

    <!-- 본문: 소개, 여행들, 마무리 -->
    <main class="col-main" id="story"></main>

    <!-- 색인: 가장 넓은 화면에서 오른쪽에 고정 -->
    <nav class="col-index" aria-label="색인">
      <div class="ix" id="ix-rail"></div>
      <p class="folio" id="folio"></p>
    </nav>
  </div>

  <!-- 색인 쪽: 좁은 화면에서는 이곳이 차례 역할 -->
  <section class="index-page" id="index" aria-labelledby="index-title">
    <div class="in">
      <h2 id="index-title">색인</h2>
      <div class="index-cols" id="index-cols"></div>
    </div>
  </section>

  <footer class="site-foot"><div class="in" id="foot"></div></footer>

  <!-- 휴대폰: 아래에 고정되는 좌석 줄 -->
  <div class="mbar" id="mbar" aria-hidden="true">
    <div class="seats seats-sm" id="seats-sm"></div>
    <p class="mbar-txt" id="mbar-txt"></p>
  </div>

  <noscript><p class="noscript">이 페이지는 자바스크립트가 켜져 있어야 내용을 보여줍니다.</p></noscript>

  <script src="content.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
