<script>
// ════════════════════════════════════════════════════════════
//  바벨 — 언어가 흩어지기 전에
//  탑이 높아질수록 카드의 글자가 흩어진다. 균열이 가득 차면 탑이 무너진다. 점수 = 층 수.
//  LOGIC 구간은 화면과 무관한 순수 로직(테스트 대상).
// ════════════════════════════════════════════════════════════

/*LOGIC_START*/
const MAX_CRACK = 10, ENERGY = 4, HAND_SIZE = 6, RETAIN_MAX = 2, HAND_CAP = 10;
const START_BRICKS = 3, SKIP_BRICKS = 3;
const LEVEL_DIV = 4;     // 층 N마다 혼란 1단계 (최대 3)
const STORM_DIV = 3;     // 층 N마다 밤마다 늘어나는 균열 +1
const NOISE_DIV = 3;     // 층 N마다 하늘이 방해 카드 1장을 덱에 넣는다
const FLOOR_SLOPE = 1.2; // 층이 높을수록 증축 비용 증가
const SUPPLY_BRICKS = 4, REPAIR_AMOUNT = 3, RARE_P = 0.28, TRAP_P = 0.4;

const TYPES = {
  build:  { label: '건설', icon: '🧱', color: 0xc2410c },
  repair: { label: '보수', icon: '🔧', color: 0x15803d },
  risk:   { label: '모험', icon: '🔥', color: 0xb91c1c },
  decode: { label: '해독', icon: '🗣️', color: 0x7e22ce },
  junk:   { label: '방해', icon: '🌀', color: 0x52525b },
};

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rnd) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}

// ── 파생 값 ──
function floorCost(G) { return Math.max(1, 2 + Math.floor(G.floors * FLOOR_SLOPE) - G.costDown - G.dayCostDown); }
function level(G) { return Math.min(3, Math.floor(G.floors / LEVEL_DIV)); }
function stormBase(G) { return Math.max(1, 1 + Math.floor(G.floors / STORM_DIV) - G.reinforce); }
function discordInHand(G) { return G.hand.filter(i => i.id === 'discord').length; }
function nightCracks(G) { return stormBase(G) + discordInHand(G); }
function deckSize(G) { return G.draw.length + G.discard.length + G.hand.length; }
function allInsts(G) { return G.hand.concat(G.draw, G.discard); }

// ── 읽기 난이도: 높이 단계 − 익숙함 ──
function fam(G, id) {
  const d = CARDS[id];
  if (d.starter || G.decoded.has(id)) return 9;
  const p = Math.min(2, G.plays[id] || 0);
  return p + (G.memory && p > 0 ? 1 : 0);
}
function readLevel(G, id) {
  if (G.dayClear) return 0;
  return Math.max(0, level(G) - fam(G, id));
}

// ── 글자 흩어짐 ──
const GLYPHS = [...'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎㅏㅑㅓㅕㅗㅛㅜㅠㅡㅣ◈◇▣※✦'];
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function glyphAt(id, i) { return GLYPHS[(hashStr(id) + i * 7919) % GLYPHS.length]; }
function isIcon(ch) { return /\p{Extended_Pictographic}/u.test(ch); }
// r: 0 그대로 / 1 숫자 → ? / 2 + 글자 깨짐(아이콘 유지) / 3 전부 깨짐
function degradeText(id, text, r) {
  if (r <= 0) return text;
  let out = '', i = 0;
  for (const ch of text) {
    i++;
    if (ch === '️') { if (r < 3) out += ch; continue; }
    if (ch === ' ' || ch === '\n') { out += ch; continue; }
    if (r < 3 && /[0-9]/.test(ch)) { out += '?'; continue; }
    if (r === 1) { out += ch; continue; }
    if (r === 2) { out += (/[가-힣A-Za-z]/.test(ch) ? glyphAt(id, i) : ch); continue; }
    out += glyphAt(id, i);
  }
  return out;
}
function degradeName(id, name, r) {
  if (r <= 1) return name;
  if (r === 2) { let i = 0, out = ''; for (const ch of name) { i++; out += ((hashStr(id) + i) % 2 === 0 && ch !== ' ') ? glyphAt(id, i) : ch; } return out; }
  let i = 0, out = ''; for (const ch of name) { i++; out += ch === ' ' ? ' ' : glyphAt(id, i); } return out;
}

// ── 카드 ──
// line: 면에 보이는 한 줄 효과, desc: 자세한 설명(탭하면 보임)
const CARDS = {
  // 시작 덱
  mud:   { name: '진흙 벽돌', type: 'build', cost: 0, starter: true, line: () => '🧱+1', desc: '벽돌 1개를 얻는다.', fx(G) { addBricks(G, 1); } },
  brick: { name: '벽돌 굽기', type: 'build', cost: 1, starter: true, line: () => '🧱+3', desc: '벽돌 3개를 얻는다.', fx(G) { addBricks(G, 3); } },
  build: { name: '증축', type: 'build', cost: 1, starter: true, line: G => `🧱-${floorCost(G)} → 🏗+1`, desc: '벽돌을 내고 한 층을 쌓는다. 층이 높을수록 벽돌이 더 든다.',
    ok: G => G.bricks >= floorCost(G), why: '벽돌이 부족하다',
    fx(G) { G.bricks -= floorCost(G); addFloors(G, 1); } },
  patch: { name: '보수', type: 'repair', cost: 1, starter: true, line: () => '💥-2', desc: '균열을 2 줄인다.', fx(G) { addCracks(G, -2); } },
  // 건설
  kiln:  { name: '가마', type: 'build', cost: 1, line: () => '🧱+5 · 💥+1', desc: '벽돌 5개를 얻지만 균열이 1 늘어난다.', fx(G) { addBricks(G, 5); addCracks(G, 1); } },
  pulley:{ name: '도르래', type: 'build', cost: 0, line: () => '🃏+1', desc: '카드를 1장 뽑는다.', fx(G) { drawCards(G, 1); } },
  scaffold: { name: '비계', type: 'build', cost: 1, line: () => '증축 -2', desc: '이번 턴 동안 증축 비용이 벽돌 2개 줄어든다.', fx(G) { G.dayCostDown += 2; } },
  grand: { name: '대공사', type: 'build', cost: 2, rare: true, line: G => `🧱-${2 * floorCost(G)} → 🏗+3`, desc: '증축 비용의 2배를 내고 3층을 쌓는다.',
    ok: G => G.bricks >= 2 * floorCost(G), why: '벽돌이 부족하다', fx(G) { G.bricks -= 2 * floorCost(G); addFloors(G, 3); } },
  spire: { name: '첨탑', type: 'build', cost: 1, rare: true, line: G => `🧱-${Math.ceil(1.5 * floorCost(G))} → 🏗+2`, desc: '증축 비용의 1.5배를 내고 2층을 쌓는다. 에너지는 1만 든다.',
    ok: G => G.bricks >= Math.ceil(1.5 * floorCost(G)), why: '벽돌이 부족하다', fx(G) { G.bricks -= Math.ceil(1.5 * floorCost(G)); addFloors(G, 2); } },
  lever: { name: '지렛대', type: 'build', cost: 1, line: () => '🧱-4 → 🏗+1', desc: '벽돌 4개를 내고 한 층을 쌓는다. 비용이 늘 같다.',
    ok: G => G.bricks >= 4, why: '벽돌이 부족하다', fx(G) { G.bricks -= 4; addFloors(G, 1); } },
  stash: { name: '쌓아둔 벽돌', type: 'build', cost: 1, line: G => `🧱+${Math.min(6, G.bricks)}`, desc: '가진 벽돌만큼 더 얻는다 (최대 6).', fx(G) { addBricks(G, Math.min(6, G.bricks)); } },
  crew:  { name: '작업조', type: 'build', cost: 1, rare: true, power: true, line: () => '매 턴 🧱+2', desc: '지속: 매 턴 시작에 벽돌 2개. 사용하면 덱에서 사라진다.', fx(G) { G.crew++; } },
  found: { name: '기초 다지기', type: 'build', cost: 1, rare: true, power: true, line: () => '증축 -1(영구)', desc: '지속: 증축 비용이 영구히 벽돌 1개 줄어든다. 사용하면 덱에서 사라진다.', fx(G) { G.costDown++; } },
  // 보수
  quick: { name: '응급 보수', type: 'repair', cost: 0, line: () => '💥-1', desc: '균열을 1 줄인다.', fx(G) { addCracks(G, -1); } },
  pillar:{ name: '튼튼한 기둥', type: 'repair', cost: 2, line: () => '💥-5', desc: '균열을 5 줄인다.', fx(G) { addCracks(G, -5); } },
  rein:  { name: '보강재', type: 'repair', cost: 1, rare: true, power: true, line: () => '밤 💥 -1', desc: '지속: 매 밤 늘어나는 균열이 1 줄어든다(최소 1). 사용하면 덱에서 사라진다.', fx(G) { G.reinforce++; } },
  inspect: { name: '점검', type: 'repair', cost: 1, line: () => '💥-1 · 🃏+1', desc: '균열을 1 줄이고 카드를 1장 뽑는다.', fx(G) { addCracks(G, -1); drawCards(G, 1); } },
  // 모험
  rush:  { name: '무리한 증축', type: 'risk', cost: 1, line: () => '🏗+2 · 💥+3', desc: '벽돌 없이 2층을 쌓지만 균열이 3 늘어난다.', fx(G) { addFloors(G, 2); addCracks(G, 3); } },
  sky:   { name: '하늘로!', type: 'risk', cost: 2, rare: true, line: G => `🧱-${floorCost(G)} → 🏗+3 · 💥+2`, desc: '증축 비용을 내고 3층을 쌓지만 균열이 2 늘어난다.',
    ok: G => G.bricks >= floorCost(G), why: '벽돌이 부족하다', fx(G) { G.bricks -= floorCost(G); addFloors(G, 3); addCracks(G, 2); } },
  vigil: { name: '밤샘 작업', type: 'risk', cost: 0, line: () => '💥+2 → ⚡+2', desc: '균열이 2 늘어나는 대신 에너지를 2 얻는다.', fx(G) { addCracks(G, 2); if (!G.over) G.energy += 2; } },
  // 해독
  interp:{ name: '통역사', type: 'decode', cost: 1, line: () => '해독 1장', desc: '가장 알아보기 힘든 카드 1장을 영구히 읽을 수 있게 한다 (손패 우선).',
    fx(G) { const n = decodeHardest(G, 1); return n.length ? `해독: ${n.join(', ')}` : '해독할 카드가 없다'; } },
  lingua:{ name: '공용어', type: 'decode', cost: 2, rare: true, line: () => '이번 턴 전부 읽힘', desc: '이번 턴 동안 모든 카드가 또렷하게 읽힌다.', fx(G) { G.dayClear = true; } },
  dict:  { name: '바벨의 사전', type: 'decode', cost: 2, rare: true, exhaust: true, line: () => '해독 3장', desc: '덱에서 가장 알아보기 힘든 카드 3장을 영구히 읽을 수 있게 한다. 사용하면 사라진다.',
    fx(G) { const n = decodeHardest(G, 3); return n.length ? `해독: ${n.join(', ')}` : '해독할 카드가 없다'; } },
  mnemo: { name: '기억술', type: 'decode', cost: 1, rare: true, power: true, line: () => '써본 카드 덜 흐림', desc: '지속: 한 번이라도 써 본 카드는 한 단계 덜 흐려진다. 사용하면 덱에서 사라진다.', fx(G) { G.memory = true; } },
  collector: { name: '방언 수집가', type: 'decode', cost: 1, line: G => `🧱+${G.decoded.size * 3}`, desc: '해독한 카드 1장당 벽돌 3개를 얻는다.', fx(G) { addBricks(G, G.decoded.size * 3); } },
  chain: { name: '연쇄', type: 'build', cost: 0, line: G => `🧱+${G.played}`, desc: '이번 턴에 이미 낸 카드 수만큼 벽돌을 얻는다.', fx(G) { addBricks(G, G.played); } },
  // 방해 (사용하면 사라짐)
  noise: { name: '소음', type: 'junk', cost: 1, junk: true, exhaust: true, line: () => '아무 일 없음', desc: '손패 자리와 에너지만 차지한다. 사용하면 사라진다.', fx() {} },
  discord: { name: '불협화음', type: 'junk', cost: 1, junk: true, exhaust: true, line: () => '밤에 손에 있으면 💥+1', desc: '밤에 손패에 있으면 균열이 1 늘어난다. 사용하면 사라진다.', fx() {} },
  fake:  { name: '거짓 설계도', type: 'junk', cost: 1, junk: true, exhaust: true, line: () => '🧱-3', desc: '벽돌 3개를 잃을 뿐 아무것도 짓지 못한다. 사용하면 사라진다.', fx(G) { G.bricks = Math.max(0, G.bricks - 3); } },
};
const STARTER = ['mud', 'mud', 'mud', 'brick', 'brick', 'brick', 'build', 'build', 'build', 'patch'];
const POOL = Object.keys(CARDS).filter(id => !CARDS[id].starter && !CARDS[id].junk);
const JUNK_GIFTS = ['noise', 'noise', 'discord', 'fake'];

// ── 자원 조작 ──
function addBricks(G, n) { G.bricks = Math.max(0, G.bricks + n); }
function addFloors(G, n) { G.floors += n; }
function addCracks(G, n) { G.cracks = Math.max(0, G.cracks + n); if (G.cracks >= MAX_CRACK) { G.cracks = MAX_CRACK; G.over = true; } }
function reshuffleIfNeeded(G) { if (!G.draw.length && G.discard.length) { G.draw = shuffle(G.discard.splice(0), G.rng); } }
function drawCards(G, n) {
  for (let i = 0; i < n && G.hand.length < HAND_CAP; i++) {
    reshuffleIfNeeded(G);
    if (!G.draw.length) break;
    G.hand.push(G.draw.pop());
  }
}
function decodeHardest(G, k) {
  const seen = new Set(), cands = [];
  for (const inst of allInsts(G)) {
    const d = CARDS[inst.id];
    if (d.starter || G.decoded.has(inst.id) || seen.has(inst.id)) continue;
    seen.add(inst.id); cands.push(inst.id);
  }
  cands.sort((a, b) => (G.plays[a] || 0) - (G.plays[b] || 0));   // 안정 정렬: 손패가 먼저 들어와 있음
  const done = cands.slice(0, k);
  done.forEach(id => G.decoded.add(id));
  return done.map(id => CARDS[id].name);
}

// ── 한 판 ──
function newInst(G, id) { return { uid: ++G.uid, id, keep: false }; }
function createRun(seed) {
  const G = {
    seed, rng: mulberry32(seed), uid: 0, day: 0, floors: 0, cracks: 0, bricks: START_BRICKS, energy: 0,
    draw: [], discard: [], hand: [], decoded: new Set(), plays: {}, owned: new Set(),
    crew: 0, reinforce: 0, costDown: 0, dayCostDown: 0, memory: false, dayClear: false,
    played: 0, noiseGiven: 0, over: false, removed: 0,
  };
  G.draw = shuffle(STARTER.map(id => newInst(G, id)), G.rng);
  return G;
}
function startDay(G) {
  G.day++;
  G.energy = ENERGY; G.dayCostDown = 0; G.dayClear = false; G.played = 0;
  G.hand.forEach(i => { i.keep = false; });
  if (G.crew) addBricks(G, 2 * G.crew);
  drawCards(G, HAND_SIZE - G.hand.length);
}
function canPlay(G, inst) {
  const d = CARDS[inst.id];
  if (G.over || G.energy < d.cost) return false;
  return d.ok ? d.ok(G) : true;
}
function whyNot(G, inst) {
  const d = CARDS[inst.id];
  if (G.energy < d.cost) return '에너지가 부족하다';
  return d.why || '';
}
function playCard(G, inst) {
  if (!canPlay(G, inst)) return { ok: false };
  const d = CARDS[inst.id];
  const wasRead = readLevel(G, inst.id);
  const lv0 = level(G);
  const b = G.bricks, f = G.floors, c = G.cracks, dc = G.decoded.size;
  G.energy -= d.cost;
  const idx = G.hand.indexOf(inst);
  if (idx >= 0) G.hand.splice(idx, 1);
  const extra = d.fx(G, inst);
  G.plays[inst.id] = (G.plays[inst.id] || 0) + 1;
  G.played++;
  if (d.power) G.owned.add(inst.id);
  if (d.exhaust || d.power) G.removed++; else G.discard.push(inst);
  const parts = [];
  if (G.bricks !== b) parts.push(`🧱${G.bricks - b > 0 ? '+' : ''}${G.bricks - b}`);
  if (G.floors !== f) parts.push(`🏗+${G.floors - f}`);
  if (G.cracks !== c) parts.push(`💥${G.cracks - c > 0 ? '+' : ''}${G.cracks - c}`);
  if (G.decoded.size !== dc) parts.push(`🗣+${G.decoded.size - dc}`);
  return { ok: true, name: d.name, msg: (parts.join('  ') || d.name) + (extra ? `\n${extra}` : ''), wasRead, levelUp: level(G) > lv0 };
}
function cloneG(G) {
  const c = Object.assign({}, G);
  c.draw = G.draw.slice(); c.discard = G.discard.slice(); c.hand = G.hand.map(x => Object.assign({}, x));
  c.decoded = new Set(G.decoded); c.plays = Object.assign({}, G.plays); c.owned = new Set(G.owned);
  c.rng = () => 0.5;
  return c;
}
// 사용 후 예상 결과 문자열
function previewCard(G, inst) {
  const c = cloneG(G), ci = c.hand.find(x => x.uid === inst.uid);
  if (!ci) return { text: '', over: false };
  const b = c.bricks, f = c.floors, k = c.cracks, h = c.hand.length, e = c.energy, dc = c.decoded.size;
  const r = playCard(c, ci);
  if (!r.ok) return { text: '', over: false };
  const p = [];
  if (c.bricks !== b) p.push(`🧱 ${b}→${c.bricks}`);
  if (c.floors !== f) p.push(`🏗 ${f}→${c.floors}`);
  if (c.cracks !== k) p.push(`💥 ${k}→${c.cracks}`);
  if (c.hand.length - (h - 1) > 0) p.push(`🃏+${c.hand.length - (h - 1)}`);
  if (c.energy !== e - CARDS[inst.id].cost) p.push(`⚡${c.energy - (e - CARDS[inst.id].cost) > 0 ? '+' : ''}${c.energy - (e - CARDS[inst.id].cost)}`);
  if (c.decoded.size !== dc) p.push(`🗣+${c.decoded.size - dc}`);
  return { text: p.join('   ') || '변화 없음', over: c.over };
}
function toggleKeep(G, inst) {
  if (inst.keep) { inst.keep = false; return true; }
  if (G.hand.filter(i => i.keep).length >= RETAIN_MAX) return false;
  inst.keep = true; return true;
}

// ── 밤 ──
function endDay(G) {
  const discord = discordInHand(G), storm = stormBase(G);
  const keepers = G.hand.filter(i => i.keep);
  G.hand.filter(i => !i.keep).forEach(i => G.discard.push(i));
  G.hand = keepers;
  addCracks(G, storm + discord);
  const gifts = [];
  if (!G.over) {
    const want = Math.floor(G.floors / NOISE_DIV);
    while (G.noiseGiven < want) {
      G.noiseGiven++;
      const id = JUNK_GIFTS[Math.floor(G.rng() * JUNK_GIFTS.length)];
      G.discard.push(newInst(G, id)); gifts.push(id);
    }
  }
  return { storm, discord, gifts, over: G.over };
}

// ── 보상 ──
function makeRewardCards(G) {
  const owned = G.owned, rares = POOL.filter(id => CARDS[id].rare && !owned.has(id)), commons = POOL.filter(id => !CARDS[id].rare);
  const out = [];
  while (out.length < 4) {
    const src = G.rng() < RARE_P ? rares : commons;
    const id = src[Math.floor(G.rng() * src.length)];
    if (!out.includes(id)) out.push(id);
  }
  if (level(G) >= 2 && G.rng() < TRAP_P) out[Math.floor(G.rng() * 4)] = 'fake';
  return out;
}
function pickRewardCard(G, id) {
  if (id) G.discard.push(newInst(G, id)); else addBricks(G, SKIP_BRICKS);
}
function removeCard(G, uid) {
  for (const arr of [G.hand, G.draw, G.discard]) {
    const i = arr.findIndex(x => x.uid === uid);
    if (i >= 0) { arr.splice(i, 1); G.removed++; return true; }
  }
  return false;
}
const MAINT = [
  { id: 'remove', icon: '🗑️', name: '카드 제거', desc: '덱에서 카드 1장을 영구히 없앤다' },
  { id: 'repair', icon: '🔧', name: '균열 보수', desc: `💥 -${REPAIR_AMOUNT}` },
  { id: 'decode', icon: '🗣️', name: '해독', desc: '가장 알아보기 힘든 카드 2장을 해독' },
  { id: 'supply', icon: '🧱', name: '자재 확보', desc: `🧱 +${SUPPLY_BRICKS}` },
];
function applyMaint(G, id, arg) {
  if (id === 'remove') return removeCard(G, arg);
  if (id === 'repair') { addCracks(G, -REPAIR_AMOUNT); return true; }
  if (id === 'decode') { decodeHardest(G, 2); return true; }
  if (id === 'supply') { addBricks(G, SUPPLY_BRICKS); return true; }
  return false;
}

const DPR = window.devicePixelRatio || 1;
const S = Math.round(Math.max(1.5, Math.min(3.5, Math.min(window.innerWidth * DPR / W, window.innerHeight * DPR / H))) * 100) / 100;
const K = 1 / S;

  load() { try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; } catch (e) { return []; } },
  add(name, floors, days) {
    const list = this.load();
    list.push({ name, floors, days, at: Date.now() });
    list.sort((a, b) => b.floors - a.floors || a.at - b.at);
    const top = list.slice(0, 20);
    try { localStorage.setItem(LB_KEY, JSON.stringify(top)); } catch (e) {}

  },
};

const txt = (scene, x, y, str, size, color, o = {}) => {
  const style = {
    fontFamily: FONT, fontSize: Math.round(size * S) + 'px', color: color || '#ffffff',
    align: o.align || 'center', fontStyle: o.bold ? 'bold' : 'normal', lineSpacing: (o.lineSpacing || 0) * S,
  };
  if (o.wrap) style.wordWrap = { width: o.wrap * S, useAdvancedWrap: true };
  return scene.add.text(x, y, str, style)
    .setOrigin(o.ox === undefined ? 0.5 : o.ox, o.oy === undefined ? 0.5 : o.oy).setScale(K);
};
const emo = (scene, x, y, e, size) =>

    .setOrigin(0.5).setPadding(4, 4, 4, 4).setScale(K);
const mix = (a, b, t) => {
  const ar = a >> 16 & 255, ag = a >> 8 & 255, ab = a & 255, br = b >> 16 & 255, bg = b >> 8 & 255, bb = b & 255;
  return (Math.round(ar + (br - ar) * t) << 16) | (Math.round(ag + (bg - ag) * t) << 8) | Math.round(ab + (bb - ab) * t);
};

    if (this.busy || this.state !== 'play') return;

    const lv = level(G);
    this.ui.add(txt(this, W / 2, 118, lv > 0 ? '글자가 흩어진 카드는 아이콘과 비용만 믿고 고르게 됩니다' : '아직 모든 카드가 또렷하게 읽힌다', 12, '#a78bfa'));
    this.rewards.forEach((id, i) => {
      const r = Math.min(2, readLevel(G, id));
      const v = this.cardView(id, 222, 150, r, { wide: true });
      v.setPosition(124 + (i % 2) * 232, 230 + Math.floor(i / 2) * 166);
      v.bg.setInteractive({ useHandCursor: true });
      v.bg.on('pointerdown', () => this.chooseReward(i));
      this.ui.add(v);
    });
    const sb = this.add.rectangle(W / 2, 556, 320, 48, 0x334155).setInteractive({ useHandCursor: true });
    sb.on('pointerdown', () => this.chooseReward(-1));
    this.ui.add(sb);
    this.ui.add(txt(this, W / 2, 556, `고르지 않고 🧱+${SKIP_BRICKS} 받기`, 16, '#e5edf7', { bold: true }));
    this.ui.add(txt(this, W / 2, 610, `덱 ${deckSize(G)}장  ·  해독한 카드 ${G.decoded.size}장`, 13, '#8fa3bd'));
  }
  chooseReward(i) {
    if (this.state !== 'reward') return;
    pickRewardCard(this.G, i >= 0 ? this.rewards[i] : null);
    this.sfx(660, 0.12, 'triangle', 0.08);
    this.showMaint();
  }

  showMaint() {
    const G = this.G;
    this.state = 'maint';
    this.clearUI();
    this.ui.add(this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.86).setInteractive());
    this.ui.add(txt(this, W / 2, 70, '정비', 26, '#ffe6a8', { bold: true }));
    this.ui.add(txt(this, W / 2, 106, '하나를 고르세요', 16, '#e5edf7'));
    MAINT.forEach((m, i) => {
      const y = 190 + i * 96;
      const bg = this.add.rectangle(W / 2, y, 420, 80, 0x1b2740).setStrokeStyle(2, 0x334155).setInteractive({ useHandCursor: true });
      bg.on('pointerdown', () => this.chooseMaint(m.id));
      this.ui.add([bg, emo(this, 60, y, m.icon, 34), txt(this, 100, y - 14, m.name, 19, '#ffffff', { ox: 0, bold: true }), txt(this, 100, y + 14, m.desc, 14, '#cbd5e1', { ox: 0 })]);
    });
    this.ui.add(txt(this, W / 2, 600, `💥 ${G.cracks}/${MAX_CRACK}   🧱 ${G.bricks}   덱 ${deckSize(G)}장`, 14, '#8fa3bd'));
  }
  chooseMaint(id) {
    if (this.state !== 'maint') return;
    if (id === 'remove') { this.showRemove(); return; }
    applyMaint(this.G, id);
    this.sfx(520, 0.12, 'triangle', 0.08);
    this.startDayFlow();
  }

  showRemove() {
    const G = this.G;
    this.state = 'remove';
    this.clearUI();
    this.ui.add(this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.9).setInteractive());
    this.ui.add(txt(this, W / 2, 40, '없앨 카드를 고르세요', 20, '#ffe6a8', { bold: true }));
    const bb = this.add.rectangle(60, 40, 90, 34, 0x334155).setInteractive({ useHandCursor: true });
    bb.on('pointerdown', () => this.showMaint());
    this.ui.add([bb, txt(this, 60, 40, '← 뒤로', 14, '#ffffff')]);
    const list = allInsts(G).slice().sort((a, b) => CARDS[a.id].type.localeCompare(CARDS[b.id].type) || a.id.localeCompare(b.id));
    const cols = 5, tw = 88, th = 56, gx = 4;
    const x0 = (W - (cols * tw + (cols - 1) * gx)) / 2 + tw / 2;
    list.forEach((inst, i) => {
      const def = CARDS[inst.id], r = Math.min(2, readLevel(G, inst.id));
      const x = x0 + (i % cols) * (tw + gx), y = 100 + th / 2 + Math.floor(i / cols) * (th + gx);
      const bg = this.add.rectangle(x, y, tw, th, r >= 2 ? 0x241a38 : 0x172033).setStrokeStyle(2, TYPES[def.type].color).setInteractive({ useHandCursor: true });
      bg.on('pointerdown', () => {
        if (this.state !== 'remove') return;
        removeCard(G, inst.uid);
        this.toast('카드를 덱에서 없앴다', '#fde68a', 330);
        this.startDayFlow();
      });
      this.ui.add([bg, txt(this, x, y - 12, `${TYPES[def.type].icon} ${def.cost}`, 11, '#fde047'),
        txt(this, x, y + 8, degradeName(inst.id, def.name, r), 11, r >= 2 ? '#e9d5ff' : '#ffffff', { bold: true, wrap: tw - 6 })]);
    });
  }

  // ═════════════ 붕괴 ═════════════
  collapse() {
    this.state = 'collapse';
    this.busy = true;
    this.toast('탑이 비명을 지른다…', '#fecaca', 300);
    this.cameras.main.shake(1800, 0.006);
    [196, 165, 131, 98].forEach((f, i) => this.time.delayedCall(i * 350, () => this.sfx(f, 0.4, 'sawtooth', 0.08)));
    const n = this.floorRects.length;
    this.floorRects.forEach((r, i) => {
      this.tweens.add({
        targets: r, x: r.x + (Math.random() - 0.5) * 280, y: 470, angle: (Math.random() - 0.5) * 200, alpha: 0,
        duration: 1100 + Math.random() * 700, delay: 700 + (n - 1 - i) * 70, ease: 'Quad.In',
      });
    });
    this.tweens.add({ targets: this.flag, y: 470, alpha: 0, duration: 900, delay: 600 });
    this.time.delayedCall(700 + n * 70 + 2000, () => this.showResult());
  }

  showResult() {
    const G = this.G;
    this.clearUI();
    this.ui.add(this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.84).setInteractive());
    this.ui.add(txt(this, W / 2, 130, '탑이 무너졌다', 40, '#fecaca', { bold: true }));
    this.ui.add(txt(this, W / 2, 190, '균열이 한계에 닿았고\n사람들은 서로의 말을 알아듣지 못한 채 흩어졌다', 15, '#cbd5e1', { lineSpacing: 6 }));
    this.ui.add(txt(this, W / 2, 300, `${G.floors}층`, 72, '#ffe6a8', { bold: true }));
    this.ui.add(txt(this, W / 2, 370, `${G.day}일 동안 쌓음  ·  해독한 카드 ${G.decoded.size}장`, 15, '#8fa3bd'));
    this.time.delayedCall(1400, () => this.askName());
  }

  askName() {
    const G = this.G;
    let saved = '';
    try { saved = localStorage.getItem(NAME_KEY) || ''; } catch (e) {}
    let name = null;
    if (G.floors > 0) name = window.prompt('리더보드에 등록할 이름 (최대 8자, 취소하면 등록 안 함)', saved);
    if (name && name.trim()) {
      name = name.trim().slice(0, 8);
      try { localStorage.setItem(NAME_KEY, name); } catch (e) {}
      Leaderboard.add(name, G.floors, G.day);
    }
    this.clearUI();
    this.state = 'over';
    this.ui.add(this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.88).setInteractive());
    this.ui.add(txt(this, W / 2, 110, '탑이 무너졌다', 32, '#fecaca', { bold: true }));
    this.ui.add(txt(this, W / 2, 175, `${G.floors}층`, 48, '#ffe6a8', { bold: true }));
    this.boardList(250, 8);
    this.button('다시 하기', W / 2, 680, () => this.startRun());
  }

  // ═════════════ 메뉴 / UI 공통 ═════════════
  clearUI() { this.ui.removeAll(true); }

  button(label, x, y, cb, w = 250) {
    const bg = this.add.rectangle(x, y, w, 60, 0xe0b04a).setInteractive({ useHandCursor: true });
    bg.on('pointerdown', cb);
    this.ui.add([bg, txt(this, x, y, label, 26, '#2b1a05', { bold: true })]);
  }

  boardList(y, n = 5) {
    const list = Leaderboard.load().slice(0, n);
    const lines = list.length
      ? list.map((r, i) => `${i + 1}.  ${r.name}   ${r.floors}층 (${r.days}일)`).join('\n')
      : '아직 기록이 없습니다';
    this.ui.add(txt(this, W / 2, y, '🏆 리더보드 (이 기기)', 20, '#ffd966', { bold: true }));
    this.ui.add(txt(this, W / 2, y + 28, lines, 18, '#e8f1fb', { oy: 0, lineSpacing: 6 }));
  }

  showMenu() {
    this.state = 'menu';
    this.clearUI();
    this.ui.add(this.add.rectangle(W / 2, H / 2, W, H, 0x0b1220, 0.92).setInteractive());
    this.ui.add(txt(this, W / 2, 110, '바벨', 64, '#ffe6a8', { bold: true }));
    this.ui.add(txt(this, W / 2, 172, '언어가 흩어지기 전에, 하늘까지', 19, '#bfe3ff'));
    this.ui.add(txt(this, W / 2, 330,
      '🏗  층을 쌓을수록 점수가 오릅니다. 점수 = 층 수\n\n' +
      '💥  매일 밤 균열이 늘고, 높을수록 더 빨리 늘어납니다\n     균열이 가득 차면 탑이 무너집니다 (게임 끝)\n\n' +
      '🃏  하루 ⚡4: 카드로 🧱을 모으고 🏗을 쌓고 💥을 수리하세요\n     밤마다 카드를 골라 덱을 키우세요\n\n' +
      '🗣  탑이 높아지면 처음 보는 카드의 글자가 흩어집니다\n     써 보거나 통역하면 점점 읽을 수 있습니다\n\n' +
      '🌀  하늘이 방해 카드를 보냅니다. 정비에서 없애세요',
      14, '#e8f1fb', { lineSpacing: 3 }));
    this.button('시작', W / 2, 538, () => this.startRun());
    this.boardList(610, 3);
    this.ui.add(txt(this, W / 2, 790, `build ${BUILD_TAG} · 해상도 ×${S}`, 11, '#475569'));
  }

  // ═════════════ 효과 ═════════════
  toast(str, color, y = 392) {
    const t = txt(this, W / 2, y, str, 19, color || '#ffffff', { bold: true, lineSpacing: 4 }).setDepth(170);
    this.tweens.add({ targets: t, y: y - 36, alpha: 0, duration: 1100, delay: 450, onComplete: () => t.destroy() });
  }

  initAudio() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try { const C = window.AudioContext || window.webkitAudioContext; if (C) this.ac = new C(); } catch (e) { this.ac = null; }
  }
  sfx(freq, dur, type = 'sine', vol = 0.08) {
    if (!this.ac) return;
    try {
      const t0 = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0);
      o.frequency.exponentialRampToValueAtTime(freq * 1.4, t0 + dur * 0.6);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(this.ac.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
}

new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: W * S,
  height: H * S,
  backgroundColor: '#0b1220',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: Main,
});
</script>
</body>
</html>
