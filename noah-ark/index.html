<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>노아의 방주 — 합쳐라, 무지개까지</title>
<meta name="description" content="같은 동물을 합쳐 더 큰 동물로 키우고, 마지막엔 무지개를 띄우세요. 창세기 6~9장 모티브의 점수제 합성 퍼즐.">
<style>
  html, body { margin: 0; height: 100%; background: #0b1d33; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #game { width: 100%; height: 100%; }
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
</head>
<body>
<div id="game"></div>
<script>
// ════════════════════════════════════════════════════════════
//  노아의 방주 — 합쳐라, 무지개까지
//  수박게임(Suika)식 합성 퍼즐 + 차오르는 홍수(압박) + 무지개(구원)
// ════════════════════════════════════════════════════════════
const W = 480, H = 800;
// 선명도: 내부 캔버스를 S배로 만들고 카메라를 S배 줌 (좌표계는 그대로 480x800)
const S = (window.devicePixelRatio || 1) >= 2.5 ? 3 : 2;
const FONT = '"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';

// 방주 내부(플레이 영역)
const XL = 34, XR = 446;          // 좌우 벽 안쪽
const FLOOR0 = 690;               // 물이 없을 때 바닥(=수면) 높이
const FLOOR_BOTTOM = 722;         // 방주 바닥 보 위치
const LINE_Y = 178;               // 이 선 위로 쌓이면 위험
const SPAWN_Y = 122;              // 동물을 들고 있는 높이

// 물리
const STEP = 1 / 120, GRAV = 1500, DAMP = 0.9985, ITER = 6;
const CEIL = 84;                  // 천장(HUD 아래). 눌려서 위로 튀어나가는 것을 막음
const MAX_STEP_V = 9;             // 한 스텝 최대 이동량(px) ≈ 초속 1080px

// 홍수
const CUBIT = 7;                  // 1규빗 = 7px (창세기 7:20, 물이 15규빗까지 오름)
const WATER_RATE = 0.525;         // 초당 px (기존 0.35의 1.5배) ≈ 초당 0.075규빗
const WATER_MAX = 15 * CUBIT;
const RAINBOW_RELIEF = 65;

const LB_KEY = 'noah-ark-leaderboard-v2';
const NAME_KEY = 'noah-ark-name';

// 합성 사다리: 개미 → … → 코끼리 → 🌈
const TIERS = [
  { e: '🐜', n: '개미',   r: 15, c: 0xc9a27e },
  { e: '🐦', n: '새',     r: 21, c: 0x7ec8e3 },
  { e: '🐑', n: '양',     r: 28, c: 0xf1ece0 },
  { e: '🐐', n: '염소',   r: 35, c: 0xd8c7a3 },
  { e: '🐖', n: '돼지',   r: 43, c: 0xf4a6b8 },
  { e: '🐄', n: '소',     r: 52, c: 0xe8d9b5 },
  { e: '🐫', n: '낙타',   r: 62, c: 0xd9a65a },
  { e: '🦒', n: '기린',   r: 72, c: 0xf2c14e },
  { e: '🐘', n: '코끼리', r: 84, c: 0x9aa7b8 },
];
const MERGE_SCORE = [0, 10, 30, 60, 100, 150, 210, 280, 360]; // 합쳐져서 "이 단계가 될 때"
const DROP_WEIGHTS = [35, 30, 22, 13];                          // 떨어지는 건 앞 4단계만
const RAINBOW_SCORE = 1000;

const rollTier = () => {
  let r = Math.random() * 100;
  for (let i = 0; i < DROP_WEIGHTS.length; i++) { r -= DROP_WEIGHTS[i]; if (r < 0) return i; }
  return 0;
};

// ───────── 리더보드 (지금은 브라우저 로컬 저장) ─────────
// 공용 리더보드로 바꿀 때는 load/add 두 함수만 서버 호출로 교체하면 됩니다.
const Leaderboard = {
  load() { try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; } catch (e) { return []; } },
  add(name, score) {
    const list = this.load();
    list.push({ name, score, at: Date.now() });
    list.sort((a, b) => b.score - a.score || a.at - b.at);
    const top = list.slice(0, 20);
    try { localStorage.setItem(LB_KEY, JSON.stringify(top)); } catch (e) {}
    return top;
  },
  best() { const l = this.load(); return l.length ? l[0].score : 0; },
};

const txt = (scene, x, y, str, size, color, o = {}) =>
  scene.add.text(x, y, str, {
    fontFamily: FONT, fontSize: size + 'px', color: color || '#ffffff', resolution: S,
    align: o.align || 'center', fontStyle: o.bold ? 'bold' : 'normal',
    lineSpacing: o.lineSpacing || 0,
  }).setOrigin(o.ox === undefined ? 0.5 : o.ox, o.oy === undefined ? 0.5 : o.oy);

class Main extends Phaser.Scene {
  constructor() { super('main'); }

  // ═════════════ 초기 구성 ═════════════
  create() {
    this.state = 'menu';
    this.pieces = [];
    this.hold = null;
    this.aimX = W / 2;
    this.aiming = false;
    this.acc = 0;
    this.water = 0;
    this.waterTarget = 0;
    this.floorY = FLOOR0;
    this.score = 0;
    this.combo = 0;
    this.comboTimer = 0;
    this.overTimer = 0;
    this.dropCd = 0;
    this.startAt = 0;
    this.clock = 0;
    this.ac = null;

    this.cameras.main.setZoom(S);
    this.cameras.main.centerOn(W / 2, H / 2);
    this.drawStatic();

    this.input.on('pointermove', (p) => {
      if (this.state === 'play') this.aimX = p.x / S;
    });
    this.input.on('pointerdown', (p) => {
      this.initAudio();
      if (this.state !== 'play') return;
      this.aimX = p.x / S;
      this.aiming = true;
    });
    this.input.on('pointerup', (p) => {
      if (this.state !== 'play' || !this.aiming) return;
      this.aiming = false;
      this.aimX = p.x / S;
      this.tryDrop();
    });

    this.ui = this.add.container(0, 0).setDepth(100);
    this.showMenu();
  }

  drawStatic() {
    // 하늘 + 먹구름
    this.add.rectangle(W / 2, H / 2, W, H, 0x0f2238);
    for (let i = 0; i < 7; i++) {
      this.add.circle(30 + i * 70, 22 + (i % 2) * 14, 52, 0x1a3552, 0.9);
    }
    // 비
    this.rain = [];
    for (let i = 0; i < 38; i++) {
      const r = this.add.rectangle(Math.random() * W, Math.random() * H, 2, 16, 0x9cc7ff, 0.28).setDepth(0.5);
      r.spd = 520 + Math.random() * 380;
      this.rain.push(r);
    }
    // 방주 내부
    const cx = (XL + XR) / 2, ih = FLOOR_BOTTOM - 140;
    this.add.rectangle(cx, 140 + ih / 2, XR - XL, ih, 0x24160b, 0.82).setDepth(1);
    // 나무 벽 + 널빤지 선
    for (const [x0, x1] of [[0, XL], [XR, W]]) {
      this.add.rectangle((x0 + x1) / 2, 140 + ih / 2 + 10, x1 - x0, ih + 20, 0x6b4423).setDepth(3);
      for (let y = 160; y < FLOOR_BOTTOM; y += 46) {
        this.add.rectangle((x0 + x1) / 2, y, x1 - x0, 2, 0x4a2f14).setDepth(3.1);
      }
    }
    this.add.rectangle(W / 2, FLOOR_BOTTOM + 12, W, 26, 0x4a2f14).setDepth(3);
    this.add.rectangle(W / 2, FLOOR_BOTTOM + 1, W, 4, 0x8b5a2b).setDepth(3.1);

    // 물
    this.waterRect = this.add.rectangle(XL, FLOOR0, XR - XL, FLOOR_BOTTOM - FLOOR0, 0x2a6fb5, 0.92)
      .setOrigin(0, 0).setDepth(2);
    this.waves = [];
    for (let i = 0; i < 16; i++) {
      const w = this.add.circle(XL + 12 + i * 26, FLOOR0, 15, 0x4aa3e8, 0.95).setDepth(2);
      this.waves.push(w);
    }

    // 수위 눈금자 (오른쪽 벽): 1규빗마다 눈금, 5규빗마다 숫자
    for (let i = 0; i <= 15; i++) {
      const y = FLOOR0 - i * CUBIT, w = i % 5 === 0 ? 16 : 8;
      this.add.rectangle(XR + 2 + w / 2, y, w, 2, i === 15 ? 0xff8a8a : 0xf6e2b8, 0.9).setDepth(3.5);
      if (i % 5 === 0 && i > 0) txt(this, XR + 26, y - 1, String(i), 12, i === 15 ? '#ff8a8a' : '#f6e2b8', { bold: true }).setDepth(3.6);
    }
    // 현재 수위 표시 (왼쪽 벽, 수면을 따라 움직임)
    this.waterTag = this.add.rectangle(XL / 2, FLOOR0, XL - 2, 18, 0x0a1829, 0.95).setDepth(3.5);
    this.waterTagText = txt(this, XL / 2, FLOOR0, '0.0', 12, '#9fd4ff', { bold: true }).setDepth(3.6);

    // 위험선
    this.lineRect = this.add.rectangle(W / 2, LINE_Y, XR - XL, 3, 0xff5a5a, 0.3).setDepth(1.5);
    this.lineText = txt(this, W / 2, LINE_Y - 14, '위험!', 16, '#ff8a8a', { bold: true }).setDepth(6).setAlpha(0);

    // 조준 가이드
    this.guide = this.add.rectangle(W / 2, (SPAWN_Y + FLOOR0) / 2, 2, FLOOR0 - SPAWN_Y, 0xffffff, 0.16).setDepth(1.6);
    this.guide.setVisible(false);

    // HUD
    this.add.rectangle(W / 2, 46, W, 92, 0x0a1829, 0.92).setDepth(8);
    txt(this, 16, 12, '점수', 14, '#8fb4d9', { ox: 0, oy: 0 }).setDepth(9);
    this.scoreText = txt(this, 16, 30, '0', 34, '#ffffff', { ox: 0, oy: 0, bold: true }).setDepth(9);
    txt(this, W - 16, 12, '최고', 14, '#8fb4d9', { ox: 1, oy: 0 }).setDepth(9);
    this.bestText = txt(this, W - 16, 30, '0', 34, '#ffd966', { ox: 1, oy: 0, bold: true }).setDepth(9);
    txt(this, W / 2, 12, '다음', 14, '#8fb4d9', { oy: 0 }).setDepth(9);
    this.nextCircle = this.add.circle(W / 2, 58, 24, 0xffffff, 0.5).setDepth(9);
    this.nextText = txt(this, W / 2, 58, '', 30).setDepth(9.5);
    this.waterText = txt(this, 16, 112, '', 16, '#9fd4ff', { ox: 0, bold: true }).setDepth(9);
    this.comboText = txt(this, W - 16, 112, '', 24, '#ffd966', { ox: 1, bold: true }).setDepth(9);

    // 하단 합성표 (수박게임 진화표처럼)
    this.add.rectangle(W / 2, 768, W, 64, 0x0a1829, 0.95).setDepth(8);
    txt(this, W / 2, 745, '같은 동물끼리 닿으면 합쳐집니다', 13, '#8fb4d9').setDepth(9);
    const items = TIERS.map(t => t.e).concat(['🌈']);
    const gap = 42, x0 = W / 2 - (items.length - 1) * gap / 2;
    items.forEach((e, i) => {
      txt(this, x0 + i * gap, 774, e, i === items.length - 1 ? 28 : 22).setDepth(9);
      if (i < items.length - 1) txt(this, x0 + i * gap + gap / 2, 774, '›', 14, '#5f86ad').setDepth(9);
    });
  }

  // ═════════════ UI 오버레이 ═════════════
  clearUI() { this.ui.removeAll(true); }
  dim(a = 0.78) { this.ui.add(this.add.rectangle(W / 2, H / 2, W, H, 0x000000, a).setInteractive()); }

  button(label, x, y, cb, w = 250) {
    const bg = this.add.rectangle(x, y, w, 60, 0xe0b04a).setInteractive({ useHandCursor: true });
    const t = txt(this, x, y, label, 26, '#2b1a05', { bold: true });
    bg.on('pointerdown', cb);
    this.ui.add([bg, t]);
  }

  boardList(y, n = 5) {
    const list = Leaderboard.load().slice(0, n);
    const lines = list.length
      ? list.map((r, i) => `${i + 1}.  ${r.name}   ${r.score}`).join('\n')
      : '아직 기록이 없습니다';
    this.ui.add(txt(this, W / 2, y, '🏆 리더보드 (이 기기)', 20, '#ffd966', { bold: true }));
    this.ui.add(txt(this, W / 2, y + 28, lines, 20, '#e8f1fb', { oy: 0, lineSpacing: 6 }));
  }

  showMenu() {
    this.clearUI();
    this.dim(0.8);
    this.ui.add(txt(this, W / 2, 150, '노아의 방주', 54, '#ffe6a8', { bold: true }));
    this.ui.add(txt(this, W / 2, 208, '합치고 합쳐서, 무지개까지', 22, '#bfe3ff'));
    this.ui.add(txt(this, W / 2, 330,
      '🖐  화면을 드래그해 위치를 잡고, 떼면 떨어집니다\n' +
      '🐑🐑 같은 동물이 닿으면 더 큰 동물로 합쳐집니다\n' +
      '🐘🐘 코끼리 두 마리가 만나면… 🌈\n' +
      '🌊 수위(규빗)가 계속 오릅니다. 무지개가 물을 물리칩니다\n' +
      '⚠️ 동물이 빨간 선 위로 쌓이면 끝',
      18, '#e8f1fb', { lineSpacing: 12 }));
    this.button('시작', W / 2, 495, () => this.startGame());
    this.boardList(575);
  }

  // ═════════════ 게임 흐름 ═════════════
  startGame() {
    this.clearUI();
    this.pieces.forEach(p => this.killPiece(p));
    this.pieces = [];
    if (this.hold) { this.hold.circle.destroy(); this.hold.text.destroy(); this.hold = null; }
    this.score = 0;
    this.combo = 0;
    this.comboTimer = 0;
    this.overTimer = 0;
    this.water = 0;
    this.waterTarget = 0;
    this.floorY = FLOOR0;
    this.acc = 0;
    this.dropCd = 0;
    this.aiming = false;
    this.aimX = W / 2;
    this.nextTier = rollTier();
    this.startAt = this.clock;
    this.state = 'play';
    this.bestShown = Leaderboard.best();
    this.makeHold();
    this.refreshHud();
    this.waterText.setText('🌊 수위 0.0 / 15 규빗');
  }

  makeHold() {
    const tier = this.nextTier;
    this.nextTier = rollTier();
    const def = TIERS[tier];
    const circle = this.add.circle(this.aimX, SPAWN_Y, def.r, def.c, 0.55).setStrokeStyle(2, 0xffffff, 0.35).setDepth(4);
    const text = this.add.text(this.aimX, SPAWN_Y, def.e, { fontFamily: FONT, fontSize: Math.round(def.r * 1.5) + 'px', resolution: S })
      .setOrigin(0.5).setPadding(6, 6, 6, 6).setDepth(5);
    this.hold = { tier, circle, text };
    this.guide.setVisible(true);
    const nd = TIERS[this.nextTier];
    this.nextCircle.setFillStyle(nd.c, 0.6);
    this.nextText.setText(nd.e);
  }

  tryDrop() {
    if (!this.hold || this.dropCd > 0) return;
    if (this.clock - this.startAt < 0.35) return;
    const h = this.hold, def = TIERS[h.tier];
    const x = Math.max(XL + def.r, Math.min(XR - def.r, this.aimX));
    this.addPiece(h.tier, x, SPAWN_Y, 0, 0);
    h.circle.destroy(); h.text.destroy();
    this.hold = null;
    this.guide.setVisible(false);
    this.dropCd = 0.5;
    this.sfx(180, 0.07, 'triangle', 0.06);
  }

  addPiece(tier, x, y, vx, vy) {
    const def = TIERS[tier];
    const circle = this.add.circle(x, y, def.r, def.c, 0.55).setStrokeStyle(2, 0xffffff, 0.35).setDepth(4);
    const text = this.add.text(x, y, def.e, { fontFamily: FONT, fontSize: Math.round(def.r * 1.5) + 'px', resolution: S })
      .setOrigin(0.5).setPadding(6, 6, 6, 6).setDepth(5);
    const p = { tier, r: def.r, x, y, px: x - vx, py: y - vy, age: 0, circle, text, dead: false };
    this.pieces.push(p);
    return p;
  }

  killPiece(p) { p.dead = true; p.circle.destroy(); p.text.destroy(); }

  refreshHud() {
    this.scoreText.setText(String(this.score));
    this.bestText.setText(String(Math.max(this.bestShown || 0, this.score)));
  }

  // ═════════════ 물리 (직접 구현한 원형 충돌, Verlet + 위치 보정) ═════════════
  physics(dt) {
    const ps = this.pieces, g = GRAV * dt * dt;
    for (const p of ps) {
      let vx = (p.x - p.px) * DAMP, vy = (p.y - p.py) * DAMP;
      // 겹침 해소로 생긴 변위가 속도로 쌓여 튕겨 나가는 것을 막는 상한
      const sp = Math.sqrt(vx * vx + vy * vy);
      if (sp > MAX_STEP_V) { const k = MAX_STEP_V / sp; vx *= k; vy *= k; }
      p.px = p.x; p.py = p.y;
      p.x += vx; p.y += vy + g;
    }
    for (let it = 0; it < ITER; it++) {
      for (let i = 0; i < ps.length; i++) {
        const a = ps[i];
        if (a.x < XL + a.r) a.x = XL + a.r;
        if (a.x > XR - a.r) a.x = XR - a.r;
        if (a.y < CEIL + a.r) a.y = CEIL + a.r;
        if (a.y > this.floorY - a.r) {
          a.y = this.floorY - a.r;
          if (it === 0) a.px = a.x - (a.x - a.px) * 0.9;
        }
        for (let j = i + 1; j < ps.length; j++) {
          const b = ps[j];
          const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r;
          if (dx > rr || dx < -rr || dy > rr || dy < -rr) continue;
          const d2 = dx * dx + dy * dy;
          if (d2 >= rr * rr) continue;
          let d = Math.sqrt(d2), nx, ny;
          if (d < 0.0001) { d = 0.0001; nx = 0; ny = 1; } else { nx = dx / d; ny = dy / d; }
          const ov = rr - d, ma = a.r, mb = b.r; // 질량비를 완만하게(작은 동물이 짓눌려 튀는 것 방지)
          const ta = mb / (ma + mb), tb = ma / (ma + mb);
          a.x -= nx * ov * ta; a.y -= ny * ov * ta;
          b.x += nx * ov * tb; b.y += ny * ov * tb;
          if (it === 0) {
            a.px = a.x - (a.x - a.px) * 0.985; a.py = a.y - (a.y - a.py) * 0.985;
            b.px = b.x - (b.x - b.px) * 0.985; b.py = b.y - (b.y - b.py) * 0.985;
          }
        }
      }
    }
  }

  // ═════════════ 합성 ═════════════
  mergePass() {
    const ps = this.pieces, used = new Set(), jobs = [];
    for (let i = 0; i < ps.length; i++) {
      const a = ps[i];
      if (used.has(a) || a.age < 0.06) continue;
      for (let j = i + 1; j < ps.length; j++) {
        const b = ps[j];
        if (used.has(b) || b.tier !== a.tier || b.age < 0.06) continue;
        const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r + 1.5;
        if (dx * dx + dy * dy <= rr * rr) { used.add(a); used.add(b); jobs.push([a, b]); break; }
      }
    }
    for (const [a, b] of jobs) this.doMerge(a, b);
    if (jobs.length) this.pieces = this.pieces.filter(p => !p.dead);
  }

  doMerge(a, b) {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const vx = ((a.x - a.px) + (b.x - b.px)) / 2, vy = ((a.y - a.py) + (b.y - b.py)) / 2;
    const tier = a.tier;
    this.killPiece(a); this.killPiece(b);

    // 콤보
    this.combo = this.comboTimer > 0 ? this.combo + 1 : 1;
    this.comboTimer = 1.4;
    const mult = 1 + 0.5 * (Math.min(this.combo, 7) - 1);

    if (tier >= TIERS.length - 1) { this.rainbow(mx, my, mult); return; }

    const nt = tier + 1, def = TIERS[nt];
    const pts = Math.round(MERGE_SCORE[nt] * mult);
    this.score += pts;
    const x = Math.max(XL + def.r, Math.min(XR - def.r, mx));
    const y = Math.min(my, this.floorY - def.r);
    const p = this.addPiece(nt, x, y, vx * 0.5, vy * 0.5);
    p.age = 0;
    p.circle.setScale(1.35); p.text.setScale(1.35);
    this.tweens.add({ targets: [p.circle, p.text], scale: 1, duration: 220, ease: 'Back.Out' });
    this.burst(x, y, def.c, 6 + nt);
    this.floatText(x, y - def.r, '+' + pts, '#ffe9a0');
    this.sfx(260 + nt * 55, 0.14, 'sine', 0.09);
    if (nt >= 6) this.cameras.main.shake(140, 0.004 + nt * 0.0007);
    if (this.combo >= 2) this.showCombo();
    this.refreshHud();
  }

  rainbow(x, y, mult) {
    const pts = Math.round(RAINBOW_SCORE * mult);
    this.score += pts;
    const before = this.waterTarget;
    this.waterTarget = Math.max(0, before - RAINBOW_RELIEF);
    const relief = ((before - this.waterTarget) / CUBIT).toFixed(1);
    this.burst(x, y, 0xffd24a, 22);
    this.cameras.main.flash(350, 255, 255, 255);
    this.cameras.main.shake(300, 0.01);
    const r = txt(this, W / 2, 400, '🌈', 180).setDepth(60).setAlpha(0.95).setScale(0.4);
    this.tweens.add({ targets: r, scale: 1.3, alpha: 0, duration: 1400, ease: 'Sine.Out', onComplete: () => r.destroy() });
    const m = txt(this, W / 2, 300, `언약의 무지개!\n수위 -${relief}규빗`, 30, '#fff2b8', { bold: true, lineSpacing: 6 }).setDepth(60);
    this.tweens.add({ targets: m, y: 250, alpha: 0, duration: 1800, onComplete: () => m.destroy() });
    this.floatText(x, y - 40, '+' + pts, '#ffe066');
    // 작은 동물들은 물과 함께 씻겨 내려갑니다
    let bonus = 0;
    for (const p of this.pieces) {
      if (!p.dead && p.tier <= 2) { this.burst(p.x, p.y, TIERS[p.tier].c, 5); this.killPiece(p); bonus += 20; }
    }
    this.pieces = this.pieces.filter(p => !p.dead);
    this.score += bonus;
    [523, 659, 784, 1047].forEach((f, i) => this.time.delayedCall(i * 110, () => this.sfx(f, 0.25, 'triangle', 0.1)));
    this.showCombo();
    this.refreshHud();
  }

  showCombo() {
    if (this.combo < 2) return;
    this.comboText.setText(`콤보 ×${this.combo}`).setScale(1.4).setAlpha(1);
    this.tweens.add({ targets: this.comboText, scale: 1, duration: 180, ease: 'Back.Out' });
  }

  // ═════════════ 효과 ═════════════
  burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2, dist = 30 + Math.random() * 50;
      const c = this.add.circle(x, y, 3 + Math.random() * 3, color, 0.9).setDepth(20);
      this.tweens.add({
        targets: c, x: x + Math.cos(ang) * dist, y: y + Math.sin(ang) * dist, alpha: 0, scale: 0.2,
        duration: 420 + Math.random() * 200, onComplete: () => c.destroy(),
      });
    }
  }

  floatText(x, y, str, color) {
    const t = txt(this, x, y, str, 22, color, { bold: true }).setDepth(30);
    this.tweens.add({ targets: t, y: y - 46, alpha: 0, duration: 800, onComplete: () => t.destroy() });
  }

  initAudio() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (C) this.ac = new C();
    } catch (e) { this.ac = null; }
  }

  sfx(freq, dur, type = 'sine', vol = 0.08) {
    if (!this.ac) return;
    try {
      const t0 = this.ac.currentTime;
      const o = this.ac.createOscillator(), g = this.ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0);
      o.frequency.exponentialRampToValueAtTime(freq * 1.5, t0 + dur * 0.6);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(this.ac.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }

  // ═════════════ 게임 오버 ═════════════
  gameOver() {
    this.state = 'over';
    this.guide.setVisible(false);
    if (this.hold) { this.hold.circle.destroy(); this.hold.text.destroy(); this.hold = null; }
    this.lineText.setAlpha(0);
    this.comboText.setText('');
    this.waterText.setText('');
    this.cameras.main.shake(300, 0.008);
    [330, 262, 196].forEach((f, i) => this.time.delayedCall(i * 150, () => this.sfx(f, 0.3, 'sawtooth', 0.07)));
    this.clearUI();
    this.dim(0.6);
    this.ui.add(txt(this, W / 2, 360, '방주가 가득 찼습니다', 36, '#ffe6a8', { bold: true }));
    this.ui.add(txt(this, W / 2, 420, `점수 ${this.score}`, 42, '#ffffff', { bold: true }));
    this.time.delayedCall(900, () => this.askName());
  }

  askName() {
    let saved = '';
    try { saved = localStorage.getItem(NAME_KEY) || ''; } catch (e) {}
    let name = null;
    if (this.score > 0) {
      name = window.prompt('리더보드에 등록할 이름 (최대 8자, 취소하면 등록 안 함)', saved);
    }
    if (name && name.trim()) {
      name = name.trim().slice(0, 8);
      try { localStorage.setItem(NAME_KEY, name); } catch (e) {}
      Leaderboard.add(name, this.score);
    }
    this.clearUI();
    this.dim(0.82);
    this.ui.add(txt(this, W / 2, 130, '방주가 가득 찼습니다', 32, '#ffe6a8', { bold: true }));
    this.ui.add(txt(this, W / 2, 195, `점수 ${this.score}`, 46, '#ffffff', { bold: true }));
    this.boardList(290, 8);
    this.button('다시 하기', W / 2, 620, () => this.startGame());
  }

  // ═════════════ 매 프레임 ═════════════
  update(time, delta) {
    const dtRaw = Math.min(delta / 1000, 0.05);
    this.clock += dtRaw;

    // 비 + 물결 (항상)
    for (const r of this.rain) {
      r.y += r.spd * dtRaw;
      if (r.y > H + 20) { r.y = -20; r.x = Math.random() * W; }
    }
    for (let i = 0; i < this.waves.length; i++) {
      this.waves[i].y = this.floorY + Math.sin(this.clock * 2.4 + i * 0.7) * 3;
    }

    if (this.state !== 'play') return;

    // 홍수
    this.waterTarget = Math.min(WATER_MAX, this.waterTarget + WATER_RATE * dtRaw);
    this.water += (this.waterTarget - this.water) * Math.min(1, dtRaw * 3);
    this.floorY = FLOOR0 - this.water;
    this.waterRect.y = this.floorY + 2;
    this.waterRect.setSize(XR - XL, FLOOR_BOTTOM - this.floorY - 2);
    const cub = this.water / CUBIT;
    this.waterTag.y = this.floorY; this.waterTagText.y = this.floorY;
    this.waterTagText.setText(cub.toFixed(1));
    this.waterText.setText(`🌊 수위 ${cub.toFixed(1)} / 15 규빗`);
    this.waterText.setColor(cub >= 11 ? '#ff9a9a' : '#9fd4ff');

    // 물리 (고정 스텝)
    this.acc += dtRaw;
    while (this.acc >= STEP) { this.physics(STEP); this.acc -= STEP; }
    for (const p of this.pieces) {
      p.age += dtRaw;
      p.circle.setPosition(p.x, p.y);
      p.text.setPosition(p.x, p.y);
    }
    this.mergePass();

    // 콤보 타이머
    if (this.comboTimer > 0) {
      this.comboTimer -= dtRaw;
      if (this.comboTimer <= 0) { this.combo = 0; this.comboText.setText(''); }
    }

    // 들고 있는 동물
    if (this.dropCd > 0) {
      this.dropCd -= dtRaw;
      if (this.dropCd <= 0 && !this.hold) this.makeHold();
    }
    if (this.hold) {
      const r = TIERS[this.hold.tier].r;
      const x = Math.max(XL + r, Math.min(XR - r, this.aimX));
      this.hold.circle.setPosition(x, SPAWN_Y);
      this.hold.text.setPosition(x, SPAWN_Y);
      this.guide.setPosition(x, (SPAWN_Y + this.floorY) / 2);
      this.guide.setSize(2, this.floorY - SPAWN_Y);
    }

    // 위험 판정
    let danger = false;
    for (const p of this.pieces) {
      if (p.age > 1.0 && p.y - p.r < LINE_Y) { danger = true; break; }
    }
    if (danger) {
      this.overTimer += dtRaw;
      const pulse = 0.5 + 0.5 * Math.sin(this.clock * 14);
      this.lineRect.setAlpha(0.35 + 0.55 * pulse);
      this.lineText.setAlpha(pulse);
      if (this.overTimer > 2.2) { this.gameOver(); return; }
    } else {
      this.overTimer = Math.max(0, this.overTimer - dtRaw * 2);
      this.lineRect.setAlpha(0.3);
      this.lineText.setAlpha(0);
    }
  }
}

new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: W * S,
  height: H * S,
  backgroundColor: '#0f2238',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: Main,
});
</script>
